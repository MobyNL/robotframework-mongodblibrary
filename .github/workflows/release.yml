name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      # Declaring any permission replaces the whole default set, so contents: read has
      # to be named too. Without it the token cannot clone a private repository and
      # checkout fails with "repository not found", which reads like a wrong URL rather
      # than a missing scope.
      contents: read
      # Required for PyPI trusted publishing; no API token needs storing.
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pipx install poetry

      - name: Check the tag matches the project version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(poetry version --short)"
          if [ "$tag" != "$version" ]; then
            echo "Tag $tag does not match pyproject version $version" >&2
            exit 1
          fi

      - name: Build
        run: poetry build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
